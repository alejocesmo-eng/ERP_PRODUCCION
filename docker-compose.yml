version: "3.8"

services:
  # 1. Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: sgi_postgres_db
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB en el .env de la raiz (ver .env.example)}"
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER en el .env de la raiz (ver .env.example)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env de la raiz (ver .env.example)}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend (FastAPI + Python)
  backend:
    build:
      context: .
      dockerfile: 04_CODIGO/BACKEND/Dockerfile
    container_name: sgi_backend_api
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?falta POSTGRES_USER en el .env de la raiz (ver .env.example)}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env de la raiz (ver .env.example)}@db:5432/${POSTGRES_DB:?falta POSTGRES_DB en el .env de la raiz (ver .env.example)}"
      SECRET_KEY: "${SECRET_KEY:?falta SECRET_KEY en el .env de la raiz (ver .env.example)}"
      JWT_SECRET_KEY_PLANOS: "${JWT_SECRET_KEY_PLANOS:?falta JWT_SECRET_KEY_PLANOS en el .env de la raiz (ver .env.example)}"
    ports:
      - "8000:8000"
    volumes:
      - ./04_CODIGO/BACKEND/static:/app/static
    depends_on:
      - db

  # 3. Frontend Web (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: 04_CODIGO/FRONTEND/Dockerfile
    container_name: sgi_frontend_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
